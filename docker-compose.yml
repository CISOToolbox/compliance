# ── Standalone compliance ─────────────────────────────────────────────
# Single-module deployment. App + dedicated PostgreSQL.
# Usage:
#   cp .env.example .env  # set DB_PASSWORD, JWT_SECRET
#   docker compose up -d
# App available on http://localhost:8082

services:
  compliance-app:
    build: .
    container_name: ciso-compliance-standalone
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://compliance:${DB_PASSWORD:-ciso2026}@compliance-db:5432/compliance
      - JWT_SECRET=${JWT_SECRET:-change-me-in-prod}
      - APP_URL=${APP_URL:-http://localhost:8082}
      # ── Standalone auth posture (AUTH-01) ──────────────────────
      # This module issues AND verifies its own sessions; there is no Pilot
      # here. MODULE_NAME selects both the audience claim ("ciso-module:compliance")
      # and the signing key, derived as
      #   HKDF-SHA256(JWT_SECRET, info="ciso-module:compliance")
      # so JWT_SECRET is never used as a signing key and a token minted by
      # another module (or another standalone deployment sharing the secret)
      # fails audience *and* signature verification here.
      # Leaving MODULE_NAME unset would collapse every standalone module onto
      # the same "ciso-module:module" key — do not remove it.
      - AUTH_MODE=${AUTH_MODE:-standalone}
      - MODULE_NAME=compliance
      - MODULE_COOKIE=compliance_token
    ports:
      - "8082:8080"
    depends_on:
      compliance-db:
        condition: service_healthy
    networks:
      - compliance-net

  compliance-db:
    image: postgres:16-alpine
    container_name: ciso-compliance-db-standalone
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # CNT-03 — minimal capability set for the official postgres image:
    # entrypoint chowns PGDATA (CHOWN/FOWNER/DAC_OVERRIDE) then steps down
    # from root to the postgres user via gosu (SETUID/SETGID).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      - POSTGRES_USER=compliance
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ciso2026}
      - POSTGRES_DB=compliance
    volumes:
      - compliance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - compliance-net

volumes:
  compliance-db-data:

networks:
  compliance-net:
